name: Award widget v2 source fix

on:
  push:
    branches:
      - award/rebuild-v2-2026-08-23

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: award/rebuild-v2-2026-08-23
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align deliberate visual assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/widget-smoke.spec.mjs')
          s = p.read_text()
          s = s.replace('await expect(quickReply).toHaveCSS("background-color", "rgb(200, 240, 106)");', 'await expect(quickReply).toHaveCSS("background-color", "rgb(229, 248, 183)");')
          s = s.replace('await expect(page.locator(".cw-tabs")).toHaveCSS("border-radius", "0px");', 'await expect(page.locator(".cw-tabs")).toHaveCSS("border-radius", "14px");')
          p.write_text(s)
          PY
          npx prettier --write src/App.tsx src/award-widget-v2.css tests/widget-smoke.spec.mjs
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/award-widget-v2.css tests/widget-smoke.spec.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format award widget v2 and align visual smoke contract"
          git push origin HEAD:award/rebuild-v2-2026-08-23
