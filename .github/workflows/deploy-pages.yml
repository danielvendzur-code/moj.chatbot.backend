name: Deploy and verify chatbot

on:
  push:
    branches: [main]
    paths-ignore:
      - "WIDGET_QUALITY_AUDIT.txt"
      - "PAGES_DEPLOY_AUDIT.txt"
      - "PAGES_WORKFLOW_STATUS.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: TypeScript check
        run: pnpm lint

      - name: Run visual security and lead contracts
        run: pnpm test -- --run

      - name: Build demo and embedded widget
        run: pnpm build:pages

      - name: Create immutable build metadata
        shell: bash
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("dist/build-meta.json",JSON.stringify({sourceSha:process.env.GITHUB_SHA,generatedAt:new Date().toISOString(),version:"restored-soft-20260825-v1"},null,2))'

      - name: Validate production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/widget.js
          test -f dist/widget.css
          test -f dist/build-meta.json
          test -f api/lead.ts
          node <<'NODE'
          const fs = require('fs');
          const css = fs.readFileSync('dist/widget.css', 'utf8');
          const js = fs.readFileSync('dist/widget.js', 'utf8');
          const main = fs.readFileSync('src/main.tsx', 'utf8');
          const embed = fs.readFileSync('src/embed.tsx', 'utf8');
          const widget = fs.readFileSync('src/components/widget/AssistantWidget.tsx', 'utf8');
          const conversation = fs.readFileSync('src/components/widget/AssistantConversation.tsx', 'utf8');
          const calculator = fs.readFileSync('src/components/widget/ToolCalculator.tsx', 'utf8');
          const flow = fs.readFileSync('src/lib/assistantFlow.ts', 'utf8');
          const types = fs.readFileSync('src/types/assistant.ts', 'utf8');
          const bridge = fs.readFileSync('src/lib/embedBridge.ts', 'utf8');
          const lead = fs.readFileSync('src/lib/leadApi.ts', 'utf8');
          const meta = JSON.parse(fs.readFileSync('dist/build-meta.json', 'utf8'));

          const must = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          must(js.includes('restored-soft-20260825-v1'), 'current widget version missing');
          must(css.includes('cw-choice-grid'), 'choice grid missing');
          must(css.includes('cw-selection-indicator'), 'selection indicator missing');
          must(css.includes('--cw-glass-panel'), 'liquid glass layer missing');
          must(css.includes('cw-tabs'), 'mode switch styles missing');
          must(widget.includes('liquid-glass-final.css'), 'final glass import missing');
          must(!main.includes('installWidgetSpotlight') && !embed.includes('installWidgetSpotlight'), 'legacy spotlight still mounted');
          must(calculator.includes('CONTACT_METHODS'), 'contact method options missing');
          must(/id:\s*"video"/.test(calculator), 'video contact option missing');
          must(lead.includes('api/lead'), 'lead API missing');
          must(conversation.includes('Vyskladať riešenie'), 'builder CTA missing');
          must(/interest:\s*\[/.test(flow), 'first question missing');
          must(/id:\s*"custom"/.test(flow), 'safe fallback option missing');
          must(/id:\s*"tracking"/.test(flow), 'order tracking feature missing');
          must(/id:\s*"order-change"/.test(flow), 'order change feature missing');
          must(/id:\s*"returns"/.test(flow), 'returns feature missing');
          must(/product:\s*"product"/.test(flow), 'product preset mapping missing');
          must(types.includes('"product"'), 'product preset type missing');
          must(bridge.includes('"product"'), 'product preset bridge missing');
          must(!/(#2aa|#1fa|teal|turquoise)/i.test(css), 'forbidden colour remains');
          must(!calculator.includes('cw-choice-arrow'), 'legacy choice arrow remains');
          must(!js.includes('REPLACE-ME'), 'placeholder remains');
          must(meta.sourceSha === process.env.GITHUB_SHA, 'build metadata SHA mismatch');
          must(meta.version === 'restored-soft-20260825-v1', 'build metadata version mismatch');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live demo and embedded assets
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"

          verify() {
            local path="$1"
            local expected="$2"
            local body="/tmp/widget-live-$(echo "$path" | tr '/.' '__').txt"

            for attempt in {1..24}; do
              if curl --location --fail --silent --show-error \
                --header "Cache-Control: no-cache" \
                "${BASE}${path}?verify=${SOURCE_SHA}-${attempt}" > "$body"; then
                if grep -Fqi -- "$expected" "$body"; then
                  echo "verified ${path}"
                  return 0
                fi
              fi
              sleep 5
            done

            echo "Live verification failed for ${path}"
            head -c 1000 "$body" 2>/dev/null || true
            return 1
          }

          verify "/" "Môj Chatbot"
          verify "/widget.js" "restored-soft-20260825-v1"
          verify "/widget.css" "--restored-forest"
          verify "/build-meta.json" "$SOURCE_SHA"

      - name: Save verified deployment report
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo "deployment=success"
            echo "dependency_audit=success"
            echo "live_smoke=success"
            echo "source_sha=${SOURCE_SHA}"
            echo "page_url=${PAGE_URL}"
            echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > PAGES_DEPLOY_AUDIT.txt

      - name: Upload verified deployment report
        uses: actions/upload-artifact@v4
        with:
          name: pages-deploy-${{ github.run_id }}
          path: PAGES_DEPLOY_AUDIT.txt
          retention-days: 14

  diagnostics:
    if: ${{ always() && github.actor != 'github-actions[bot]' }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Save workflow outcome
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "run_id=${RUN_ID}"
            echo "build_result=${BUILD_RESULT}"
            echo "deploy_result=${DEPLOY_RESULT}"
            echo "recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > PAGES_WORKFLOW_STATUS.txt

      - name: Upload workflow status
        uses: actions/upload-artifact@v4
        with:
          name: pages-status-${{ github.run_id }}
          path: PAGES_WORKFLOW_STATUS.txt
          retention-days: 14
