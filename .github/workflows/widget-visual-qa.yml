name: Widget visual QA

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/widget-visual.spec.mjs"
      - "package.json"
      - ".github/workflows/widget-visual-qa.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build widget
        run: pnpm build

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start preview server
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 > /tmp/widget-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/widget-preview.log
          exit 1

      - name: Capture mobile and desktop states
        run: npx --yes @playwright/test@1.55.0 test tests/widget-visual.spec.mjs --reporter=line --workers=1

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-visual-evidence
          path: visual-artifacts
          if-no-files-found: error
          retention-days: 3
