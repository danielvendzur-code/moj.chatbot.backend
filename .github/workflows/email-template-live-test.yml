name: Email template live test

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/email-template-live-test.yml

permissions:
  contents: read

jobs:
  send-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send one branded production test lead
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header 'Origin: https://mojchatbot.sk' \
            --header 'Content-Type: application/json' \
            --data '{"source":"email-design-live-test","name":"Test dizajnu","email":"info@mojchatbot.sk","phone":"+421948699433","company":"Môj Chatbot","web":"https://mojchatbot.sk","note":"Toto je test nového prémiového dizajnu e-mailov. Skontrolujte rozloženie, farby, typografiu, tlačidlá a mobilné zobrazenie.","interest":"AI asistent a konfigurátor","industry":"Digitálne služby","features":"Chatbot, poradca, kalkulačka a zber dopytov","timeline":"Testovacie nasadenie","reference":"TEST-EMAIL-DESIGN-20260801","consent":true}' \
            'https://moj-chatbot-backend.vercel.app/api/lead')"
          echo "$response"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' <<<"$response"
          grep -Eq '"autoReplySent"[[:space:]]*:[[:space:]]*true' <<<"$response"
