name: Pull request quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: widget-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: TypeScript check
        run: pnpm lint

      - name: Run all contracts
        run: pnpm test -- --run

      - name: Build Vercel application and direct widget
        run: pnpm build

      - name: Build GitHub Pages application and direct widget
        run: pnpm build:pages

      - name: Validate immutable production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/widget.js
          test -f dist/widget.css

          # The runtime bundle must contain the approved version, compatibility
          # marker and both exact option-1 paths.
          grep -Fq 'approved-option-one-20260802-v5' dist/widget.js
          grep -Fq 'competition-redesign-20260723-v10' dist/widget.js
          grep -Fq 'M93 84V23C93 13 81 9 74 16' dist/widget.js
          grep -Fq 'M36 69V43L51 58' dist/widget.js

          # Validate visual contracts in their source file. Vite minifies CSS
          # timing and selectors inside widget.js, so checking the source is
          # deterministic while the bundle checks above prove it is included.
          grep -Fq 'approved-option-one-widget-final.css?inline' src/lib/installLimeWhiteStyles.ts
          grep -Fq '#b9ed4d' src/approved-option-one-widget-final.css
          grep -Fq '#19834f' src/approved-option-one-widget-final.css
          grep -Fq '#0b2f20' src/approved-option-one-widget-final.css
          grep -Fq 'color 520ms' src/approved-option-one-widget-final.css
          grep -Fq 'cw-widget[class][class][class][class]' src/approved-option-one-widget-final.css
