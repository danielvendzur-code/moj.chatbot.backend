name: Pull request quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: widget-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: TypeScript check
        run: pnpm lint

      - name: Run all contracts
        run: pnpm test -- --run

      - name: Build Vercel application and direct widget
        run: pnpm build

      - name: Install browser test runtime
        run: |
          pnpm add --save-dev --lockfile=false @playwright/test@1.55.0
          pnpm exec playwright install chromium

      - name: Run desktop and mobile browser smoke tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/widget-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/widget-vite.log
            exit 1
          fi

          pnpm exec playwright test tests/widget-smoke.spec.mjs --reporter=line --workers=1

      - name: Build GitHub Pages application and direct widget
        run: pnpm build:pages

      - name: Validate immutable production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/widget.js
          test -f dist/widget.css

          # The direct runtime must carry the restored product markers and the
          # approved one-stroke Môj Chatbot brand mark used by BubbleLogo.
          grep -Fq 'restored-web-palette-20260825-v2' dist/widget.js
          grep -Fq 'archived-layout-restrained-palette' dist/widget.js
          grep -Fq 'M24 71.2L24.003 32.706L24.036' dist/widget.js
          grep -Fq 'bl__stroke' dist/widget.js

          # The emitted widget CSS must contain the identity, interaction shell
          # and the concrete chip-label persistence fix. Minifiers may remove
          # quotes around the attribute value, so validate the stable token.
          grep -Fq '#c8f06a' dist/widget.css
          grep -Fq '#12382d' dist/widget.css
          grep -Fq '#fcfbf7' dist/widget.css
          grep -Fq '.cw-panel' dist/widget.css
          grep -Fq '.cw-tabs' dist/widget.css
          grep -Fq '.cw-inputbar' dist/widget.css
          grep -Fq '.cw-calculator' dist/widget.css
          grep -Fq '.cw-chip__label' dist/widget.css
          grep -Fq 'data-sending' dist/widget.css

          # Source entry points must use only static stylesheets and never
          # restore an injected override stack or pointer tilt.
          grep -Fq 'product-widget.css' src/main.tsx
          grep -Fq 'widget-polish.css' src/main.tsx
          grep -Fq 'product-widget.css' src/embed.tsx
          grep -Fq 'widget-polish.css' src/embed.tsx
          ! grep -Eq 'installLimeWhiteStyles|installPremiumTilt|installProductRefinement' src/main.tsx
          ! grep -Eq 'installLimeWhiteStyles|installPremiumTilt|installProductRefinement' src/embed.tsx
          ! grep -Eq 'assistant-redesign|approved-option-one|masterpiece-final|product-refinement.css' src/main.tsx
          ! grep -Eq 'assistant-redesign|approved-option-one|masterpiece-final|product-refinement.css' src/embed.tsx
