name: Widget quality audit

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: widget-quality
  cancel-in-progress: true

jobs:
  quality:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip widget-quality]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile > /tmp/install.log 2>&1

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint > /tmp/lint.log 2>&1

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build > /tmp/build.log 2>&1

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm test -- --run > /tmp/test.log 2>&1

      - name: Save result
        if: always()
        run: |
          {
            echo "run_id=${{ github.run_id }}"
            echo "install=${{ steps.install.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo
            echo "===== lint ====="
            cat /tmp/lint.log 2>/dev/null || true
            echo
            echo "===== build ====="
            cat /tmp/build.log 2>/dev/null || true
            echo
            echo "===== test ====="
            cat /tmp/test.log 2>/dev/null || true
          } > WIDGET_QUALITY_AUDIT.txt

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-quality-${{ github.run_id }}
          path: WIDGET_QUALITY_AUDIT.txt
          retention-days: 14

      - name: Enforce quality result
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.test.outcome }}" = "success"
