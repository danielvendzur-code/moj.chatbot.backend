name: Widget website-match visual QA

on:
  push:
    branches:
      - polish/widget-match-website-2026-08-22
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test && bun run lint && bun run build
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture widget states
        run: |
          bun run dev -- --host 127.0.0.1 > /tmp/widget-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 0.5
          done
          mkdir -p widget-qa
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          const errors = [];

          async function capture(name, viewport, action) {
            const page = await browser.newPage({ viewport });
            page.on('console', msg => {
              if (msg.type() === 'error' && !/favicon|vercel|analytics/i.test(msg.text())) errors.push(`${name}: ${msg.text()}`);
            });
            page.on('pageerror', error => errors.push(`${name}: ${error.message}`));
            await page.goto('http://127.0.0.1:5173/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(700);
            if (action) await action(page);
            await page.waitForTimeout(450);
            const overflow = await page.evaluate(() => Math.max(0, document.documentElement.scrollWidth - document.documentElement.clientWidth));
            if (overflow > 1) errors.push(`${name}: horizontal overflow ${overflow}px`);
            await page.screenshot({ path: `widget-qa/${name}.png`, fullPage: true });
            await page.close();
          }

          await capture('desktop-launcher', { width: 1440, height: 1000 });
          await capture('desktop-chat', { width: 1440, height: 1000 }, async page => {
            await page.getByTestId('widget-launcher').click();
          });
          await capture('desktop-configurator', { width: 1440, height: 1000 }, async page => {
            await page.getByTestId('widget-launcher').click();
            await page.getByTestId('tab-calculator').click();
          });
          await capture('mobile-chat', { width: 390, height: 844 }, async page => {
            await page.getByTestId('widget-launcher').click();
          });
          await capture('mobile-configurator', { width: 390, height: 844 }, async page => {
            await page.getByTestId('widget-launcher').click();
            await page.getByTestId('tab-calculator').click();
          });

          await browser.close();
          await fs.writeFile('widget-qa/report.json', JSON.stringify({ errors }, null, 2));
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-website-match-visual-qa
          path: widget-qa
          if-no-files-found: error
